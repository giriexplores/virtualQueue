version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: virtualqueue-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  server:
    build:
      context: ./apps/server
      dockerfile: Dockerfile
    container_name: virtualqueue-server
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - REDIS_URL=redis://redis:6379
      - CORS_ORIGIN=http://localhost:5173,http://localhost:5174
      - LOG_LEVEL=info
      - RATE_LIMIT_WINDOW_MS=60000
      - RATE_LIMIT_MAX=100
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  admin:
    build:
      context: ./apps/admin
      dockerfile: Dockerfile
    container_name: virtualqueue-admin
    ports:
      - "5173:5173"
    environment:
      - NODE_ENV=production
      - VITE_API_URL=http://localhost:3001
      - VITE_WS_URL=http://localhost:3001
    depends_on:
      - server
    restart: unless-stopped

  client:
    build:
      context: ./apps/client
      dockerfile: Dockerfile
    container_name: virtualqueue-client
    ports:
      - "5174:5174"
    environment:
      - NODE_ENV=production
      - VITE_API_URL=http://localhost:3001
      - VITE_WS_URL=http://localhost:3001
      - VITE_QUEUE_ID=demo-queue
    depends_on:
      - server
    restart: unless-stopped

volumes:
  redis_data:
    driver: local